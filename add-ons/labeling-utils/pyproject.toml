[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephyr-labeling-utils"
version = "0.1.0"
description = "Labeling tools for Ephyr: automatic event detection (TTL and above-threshold) into the session vocabulary."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Aleksandr", email = "sasha.k.1618@gmail.com"},
]
dependencies = [
]

[project.urls]
Homepage = "https://github.com/Molecular-Neural-Interfaces/ephyr-add-ons/tree/main/add-ons/labeling-utils"
Repository = "https://github.com/Molecular-Neural-Interfaces/ephyr-add-ons"
Documentation = "https://github.com/Molecular-Neural-Interfaces/ephyr"

[tool.setuptools.packages.find]
where = ["."]
include = ["ephyr_add_ons*"]
namespaces = true

[project.entry-points."ephyr.add_ons"]
events_detection = "ephyr_add_ons.labeling_utils.events_detection:EventsDetectionAddOn"
