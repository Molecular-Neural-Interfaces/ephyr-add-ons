[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephyr-spike-utils"
version = "0.1.0"
description = "Spike analysis toolkit for Ephyr: MAD detection, viewer overlays, navigation, aligned waveforms, and rasters."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Aleksandr", email = "sasha.k.1618@gmail.com"},
]
dependencies = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/Molecular-Neural-Interfaces/ephyr-add-ons/tree/main/add-ons/spike-utils"
Repository = "https://github.com/Molecular-Neural-Interfaces/ephyr-add-ons"
Documentation = "https://github.com/Molecular-Neural-Interfaces/ephyr"

[tool.setuptools.packages.find]
where = ["."]
include = ["ephyr_add_ons*"]
namespaces = true

[project.entry-points."ephyr.add_ons"]
spike_detection = "ephyr_add_ons.spike_utils.spike_detection:SpikeDetectionAddOn"
spike_viewer = "ephyr_add_ons.spike_utils.spike_viewer:SpikeViewerAddOn"
spike_navigation = "ephyr_add_ons.spike_utils.spike_navigation:SpikeNavigationAddOn"
aligned_spikes_plot = "ephyr_add_ons.spike_utils.aligned_spikes_plot:AlignedSpikesPlotAddOn"
raster_plot = "ephyr_add_ons.spike_utils.raster_plot:RasterPlotAddOn"
